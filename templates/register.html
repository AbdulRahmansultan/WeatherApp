<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body class="register-page">
    <div class="register-container">
        <h2 class="register-title">Register</h2>
        <form class="register-form" action="" method="post">
            <input class="register-input" type="text" name="username" placeholder="username" required>
            <input class="register-input" type="email" name="email" placeholder="email" required>
            <input class="register-input" type="password" name="password" placeholder="password" required>
            <input class="register-input" type="password" name="confirm_password" placeholder="confirm_password" required>
            
            <button class="register-btn" type="submit">Register</button>
        </form>
        {% if register_message %}
            <p class="register-message">{{ register_message}}</p>
        {% endif %}
        <p class="auth-switch-message">
    Already have an account? <a href="{{ url_for('login') }}">Login here</a>.
</p>
    </div>
    
    
    
</body>
</html>
